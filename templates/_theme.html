{# Pro3AI design tokens (Pro3AI-UI-Design-System.md §2, light mode only) plus the shared component classes. #}
<style type="text/tailwindcss">
  @theme inline {
    --font-sans: 'Inter', sans-serif;

    --radius-sm: calc(var(--radius) - 4px);
    --radius-md: calc(var(--radius) - 2px);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) + 4px);
    --radius-2xl: calc(var(--radius) + 8px);

    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-secondary: var(--secondary);
    --color-secondary-foreground: var(--secondary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--destructive);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --color-sidebar: var(--sidebar);
    --color-sidebar-foreground: var(--sidebar-foreground);
    --color-sidebar-primary: var(--sidebar-primary);
    --color-sidebar-accent: var(--sidebar-accent);
    --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
    --color-sidebar-border: var(--sidebar-border);

    /* §3.4 RAG and §3.6 stat-tile greys, promoted to tokens per §14. */
    --color-rag-red: #e53f2c;
    --color-rag-amber: #d9c832;
    --color-rag-green: #8ee997;
    --color-tile-text: #1c2024;
    --color-tile-hint: #a7acab;
  }

  :root {
    --radius: 0.5rem;
    --background: #f8fafc;
    --foreground: #0f172a;
    --card: #ffffff;
    --card-foreground: #0f172a;
    --primary: #0d9488;
    --primary-foreground: #ffffff;
    --secondary: #ccfbf1;
    --secondary-foreground: #115e59;
    --muted: #f1f5f9;
    --muted-foreground: #64748b;
    --accent: #f0fdfa;
    --accent-foreground: #0f172a;
    --destructive: #dc2626;
    --border: #e2e8f0;
    --input: #e2e8f0;
    --ring: #0d9488;
    --sidebar: #f8fafc;
    --sidebar-foreground: #0f172a;
    --sidebar-primary: #0d9488;
    --sidebar-accent: #ccfbf1;
    --sidebar-accent-foreground: #115e59;
    --sidebar-border: #e2e8f0;
  }

  @layer base {
    * { @apply border-border outline-ring/50; }
    body {
      @apply bg-background font-sans text-foreground;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
  }

  @layer components {
    .card { @apply rounded-xl border bg-card text-card-foreground shadow-sm; }
    .card-title { @apply text-base font-semibold text-foreground; }
    .page-title { @apply mb-2 text-2xl font-bold text-foreground lg:text-3xl; }
    .link { @apply font-medium text-primary hover:underline; }
    .badge { @apply inline-flex items-center gap-1 whitespace-nowrap rounded-full border border-transparent px-2 py-0.5 text-xs font-medium; }
    .input {
      @apply h-11 rounded-lg border border-input bg-background px-3 text-sm shadow-xs outline-none transition-colors
             placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50;
    }
    .data-table { @apply min-w-full text-sm; }
    .data-table thead tr { @apply bg-secondary/90 text-left; }
    .data-table th { @apply whitespace-nowrap px-6 py-4 font-bold text-foreground/70; }
    .data-table td { @apply px-6 py-3 font-medium text-foreground/80; }
    .data-table tbody tr { @apply border-b border-border last:border-0 hover:bg-accent; }
  }
</style>
