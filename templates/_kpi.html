<div class="flex min-w-0 flex-col rounded-lg bg-card px-3 pt-[15px] pb-4 text-left text-tile-text shadow-[0px_4px_4px_rgba(0,0,0,0.25)]">
  <div class="min-h-[42px] text-sm font-semibold leading-[150%] tracking-[0.15px]">{{ label }}</div>
  <div class="truncate text-[32px] font-bold leading-[150%] tracking-[0.15px] tabular-nums" title="{{ value }}">{{ value }}</div>
  {% if sub %}<div class="mt-[7px] text-[11px] text-tile-hint">{{ sub }}</div>{% endif %}
</div>
