{% extends "public.html" %}
{% block title %}Log In · Pro3AI Admin{% endblock %}
{% block card %}
  <h1 class="mb-4 text-3xl font-bold">Log In</h1>
  <p class="mb-6 text-sm text-secondary-foreground">Pro3AI platform administration</p>
  <form method="post" class="flex w-full flex-col gap-4">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% for field in form %}{% include "_field.html" with field=field only %}{% endfor %}
    <button type="submit" class="btn btn-primary mt-2 w-full">Log In</button>
  </form>
{% endblock %}
