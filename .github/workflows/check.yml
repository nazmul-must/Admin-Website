name: check

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway key; real keys come from the deployment's secret store.
      DJANGO_SECRET_KEY: ci-only-not-a-secret-${{ github.run_id }}-0123456789abcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint gate
        run: make check
      - name: Deployment checklist
        run: make deploy-check
      - name: Tests with coverage
        run: make coverage
      - name: Type check (advisory)
        run: make type-check
        continue-on-error: true
